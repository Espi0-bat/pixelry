<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>PIXELRY</title>
  <script>
    // SPA fallback para GitHub Pages: converte /rota/profunda em /?/rota/profunda
    // e o index.html restaura a URL real antes do React Router assumir.
    // https://github.com/rafgraph/spa-github-pages
    (function () {
      var pathSegmentsToKeep = 0; // domínio na raiz (base: '/')
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    })();
  </script>
</head>
<body></body>
</html>
